name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    # Environment name
    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Stage package
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRE="${GITHUB_REF_NAME#*-}"
            DIST_TAG="${PRE%%.*}"
          else
            DIST_TAG="latest"
          fi

          echo "Publishing to stage with tag: $DIST_TAG"
          npm stage publish --tag "$DIST_TAG"
